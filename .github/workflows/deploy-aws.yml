name: Fast Auto Deploy to AWS Lightsail

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Fast Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Fast Production Build (GitHub 16GB Runner)
        run: |
          node build.js
          tar -czf dist.tar.gz dist

      - name: Transfer Built Dist to Lightsail
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        if: ${{ env.SSH_KEY != '' }}
        uses: appleboy/scp-action@master
        continue-on-error: true
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || '34.194.119.199' }}
          username: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          source: "dist.tar.gz"
          target: "/home/ubuntu/smarthire"

      - name: Apply Update and Restart PM2
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        if: ${{ env.SSH_KEY != '' }}
        uses: appleboy/ssh-action@master
        continue-on-error: true
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || '34.194.119.199' }}
          username: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Applying fast update on AWS Lightsail..."
            cd ~/smarthire
            git pull origin main
            tar -xzf dist.tar.gz
            cp -r dist smarthire-react/dist 2>/dev/null || true
            pm2 restart smarthire-ats --update-env
            echo "✅ SmartHire ATS updated in seconds!"
